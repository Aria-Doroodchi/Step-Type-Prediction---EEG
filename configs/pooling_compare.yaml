# =====================================================================
# Overlay for the pooling comparison (scripts/09_pooling_comparison.py).
# Layered on configs/default.yaml. Deliberately uses a *reduced* feature set
# and light search so the three workflows (per_participant / partial / full)
# complete quickly -- the comparison is about the RELATIVE inner-vs-outer gap
# across pooling strategies, which holds regardless of the absolute AUC level.
# The workflows themselves run on the full default config too.
# =====================================================================

# A cohort subset spanning the signal range (strong -> hard).
participants: [P30, P02, P15, P13, P25, P07, P12, P08]

features:
  bin_n: 0.25
  min_time: 0.0            # full CNV (project default)
  max_time: 2.0
  blocks: [amplitude, slopes]   # drop psd + src -> ~2k features instead of ~26k
  amplitude:
    bin_widths: [0.25, 0.5]
    stats: [mean, std]

modeling:
  cv:
    mode: repeated_stratified
    n_splits: 4
    n_repeats: 1
    inner_splits: 2
    chronological_check: false
  search:
    method: auto
    n_iter: 8
    halving:
      resource: n_estimators
      min_resources: 40
      max_resources: 160
      factor: 3
  correlation_threshold: 0.97
  k_best: 150
  feature_selection:
    method: stability
    stability:
      n_subsamples: 8
      n_lambda: 5
      threshold: 0.55
      max_features: 40
      min_features: 6
  gain_prune:
    enabled: true
    refit: true
    mode: zero
  shap_prune:
    enabled: false
  xgb:
    n_estimators: 160
    param_grid:
      max_depth: [2, 3, 4]
      min_child_weight: [1, 3]
      gamma: [0, 0.5, 1.0]
      reg_lambda: [1, 5, 10]
      reg_alpha: [0, 0.5]
      subsample: [0.7, 1.0]
      colsample_bytree: [0.6, 1.0]
      learning_rate: [0.03, 0.05]

logging:
  level: INFO
  stamp_runs: true
