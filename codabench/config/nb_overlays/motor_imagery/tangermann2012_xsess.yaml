# Cross-session proxy (sealed-phase prep, 2026-09-25): BNCI2014_001, 9 subjects,
# 4-class MI. Session '0train' -> train, '1test' (a different day) -> test.
# Val = a 2 % random slice of the training windows (neuralset rejects an empty
# split); only the train loader reaches a Track 2 solver, and our solvers
# hold out their own validation data. Installed by scripts/install_xsess_overlays.sh.
data:
  study:
    source:
      name: Tangermann2012Review
    split:
      =replace=: true
      name: PredefinedSplit
      test_split_query: "session == '1test'"
      col_name: split
      valid_split_by: _index
      valid_split_ratio: 0.02
      valid_random_state: 33
brain_model_output_size: &brain_model_output_size 4
metrics: !!python/object/apply:neuralbench.defaults.metrics.get_classification_metric_configs
  - *brain_model_output_size
