# As scherer2015_xsess, restricted to the three classes closest to the sealed
# phase: 1 WORD (word association), 2 SUB (mental subtraction = calculation),
# 4 HAND (right-hand kinesthetic MI). Label indices 0 WORD, 1 SUB, 2 HAND.
data:
  study:
    source:
      name: Scherer2015Individually
    split:
      =replace=: true
      name: PredefinedSplit
      test_split_query: "session == '1'"
      col_name: split
      valid_split_by: _index
      valid_split_ratio: 0.02
      valid_random_state: 33
    filter_stimuli:
      name: QueryEvents
      query: "type != 'Stimulus' or code in [1, 2, 4, '1', '2', '4']"
  start: 3.0
  duration: 4.0
brain_model_output_size: &brain_model_output_size 3
metrics: !!python/object/apply:neuralbench.defaults.metrics.get_classification_metric_configs
  - *brain_model_output_size
